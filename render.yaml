services:
  - type: web
    name: vulnex
    runtime: node
    buildCommand: npm install && npm run build && pip install -r requirements.txt
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: USE_GEMINI
        value: "true"
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: PYTHONUTF8
        value: "1"
      - key: PYTHONIOENCODING
        value: utf-8
